name: cpp_services

x-dev-build: &dev-build
  context: .
  args:
    GCC_VERSION: ${GCC_VERSION:?set in toolchain.env; build with ./spur images}

x-wasm-build: &wasm-build
  context: .
  dockerfile: Dockerfile.wasm
  args:
    EMSDK_VERSION: ${EMSDK_VERSION:?set in toolchain.env; build with ./spur images}
    CMAKE_VERSION: ${CMAKE_VERSION:?set in toolchain.env; build with ./spur images}

x-windows-build: &windows-build
  context: .
  dockerfile: Dockerfile.windows
  args:
    MINGW_GCC_MINIMUM: ${MINGW_GCC_MINIMUM:?set in toolchain.env; build with ./spur images}

services:
  build:
    build: *dev-build
    volumes:
      - .:/app
      - ./build:/app/build
    command: ./spur build

  run:
    build: *dev-build
    volumes:
      - .:/app
      - ./build:/app/build
    command: ./spur test

  dev:
    build: *dev-build
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash

  perf:
    build: *dev-build
    privileged: true
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash

  wasm:
    build: *wasm-build
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash

  windows:
    build: *windows-build
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash
