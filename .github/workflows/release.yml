name: release

# Started by hand on master. The build job makes the release once (the toolchain images and the staged release tree);
# every later job tests those same files, and only when everything passed does the publish job promote them unchanged:
# tag the commit and publish (spec §4.2). With dry_run, nothing is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH, equal to project(Oly VERSION) and the package.json versions
        type: string
        required: true
      dry_run:
        description: Run every check and publish nothing
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time: two runs of the same version would both pass `check`, and the second would overwrite the image
# tags of the first before failing at the git tag.
concurrency:
  group: release
  cancel-in-progress: false

# The version input reaches the shell through the environment, never through ${{ }} inside a script.
env:
  VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry_run }}
  REGISTRY: ghcr.io/esliph

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # A dry run publishes nothing, so it may start from another branch: a change to this file runs before it reaches
      # master, and an already tagged version can be run again.
      - name: Releases are cut from master
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ] && [ "$DRY_RUN" != true ]; then
            echo "::error::dispatched on $GITHUB_REF: releases are cut from refs/heads/master; other branches run only with dry_run"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: The version is the one in the tree
        run: sh tools/release/check_version.sh "$VERSION" .
      - name: The tag does not exist yet
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::tag v$VERSION already exists: a real release of this version would stop here"
            else
              echo "::error::tag v$VERSION already exists"
              exit 1
            fi
          fi

  # The one place the release is built. The images and the tree it uploads are the ones every later job tests and the
  # publish job pushes.
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # Three toolchain images, their build caches and the saved copies are not expected to fit in what the runner has
        # left; this was not measured.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Let the runner write what the containers create
        # The containers run as root and write into the mounted checkout, while the stage and staged tasks write into the
        # same folders from the host as the runner: without this, `./spur stage` failed with "mkdir: Permission denied" on
        # the build/ that Docker had created. The default ACL reaches every file a container creates later.
        run: |
          mkdir -p build
          sudo setfacl -R -m "u:$(id -un):rwX" -m "d:u:$(id -un):rwX" .
      - name: Build the images
        run: ./spur images dev wasm windows
      - name: Stage the release
        run: ./spur stage "$VERSION"
      - name: Tests of the release scripts and archives
        run: ./spur release-test
      - name: Save the images
        # One file per image: a job that tests in one toolchain downloads only that one.
        run: |
          mkdir -p build/images
          for image in dev wasm windows; do
            docker save "oly-engine-$image" | zstd -q -T0 -3 -o "build/images/$image.tar.zst"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-tree
          path: build/release/${{ inputs.version }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: image-dev
          path: build/images/dev.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: image-wasm
          path: build/images/wasm.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: image-windows
          path: build/images/windows.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # One job per preset: run one after another they took 16 minutes (2026-11-19).
  engine:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: test
            images: dev
          - task: games-test
            images: wasm
          - task: native-games-test
            images: dev
          - task: windows-test
            images: windows
          - task: subproject-test
            images: dev wasm
    name: engine (${{ matrix.task }})
    env:
      GH_TOKEN: ${{ github.token }}
      TASK: ${{ matrix.task }}
      IMAGES: ${{ matrix.images }}
    steps:
      - uses: actions/checkout@v4
      - name: Let the runner write what the containers create
        run: |
          mkdir -p build
          sudo setfacl -R -m "u:$(id -un):rwX" -m "d:u:$(id -un):rwX" .
      - name: Load the images the build job saved
        run: |
          for image in $IMAGES; do
            gh run download "$GITHUB_RUN_ID" --name "image-$image" --dir "build/images/$image"
            zstd -q -dc "build/images/$image/$image.tar.zst" | docker load
            rm -rf "build/images/$image"
          done
      - name: Engine tests
        run: ./spur "$TASK"

  # The consumer test against the staged release, the files a game downloads. It also builds, from the saved images and
  # the staged oly-tools, the images the publish job pushes.
  staged-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The three saved images, the three built over them and their saved copies; not measured.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Let the runner write what the containers create
        run: |
          mkdir -p build
          sudo setfacl -R -m "u:$(id -un):rwX" -m "d:u:$(id -un):rwX" .
      - name: Load the images the build job saved
        run: |
          for image in dev wasm windows; do
            gh run download "$GITHUB_RUN_ID" --name "image-$image" --dir "build/images/$image"
            zstd -q -dc "build/images/$image/$image.tar.zst" | docker load
            rm -rf "build/images/$image"
          done
      - uses: actions/download-artifact@v4
        with:
          name: release-tree
          path: build/release/${{ inputs.version }}
      - name: Consumer test, staged
        run: ./spur staged-test "$VERSION"
      - name: Save the tested images
        # The images ./spur staged-test ran are the ones saved, under the names the publish job pushes.
        run: |
          mkdir -p build/publish
          : > build/publish/image-ids.txt
          for image in dev wasm windows; do
            docker tag "oly-local/oly-$image:$VERSION" "$REGISTRY/oly-$image:$VERSION"
            printf '%s %s\n' "$REGISTRY/oly-$image:$VERSION" "$(docker image inspect --format '{{.Id}}' "$REGISTRY/oly-$image:$VERSION")" >> build/publish/image-ids.txt
          done
          docker save "$REGISTRY/oly-dev:$VERSION" "$REGISTRY/oly-wasm:$VERSION" "$REGISTRY/oly-windows:$VERSION" | gzip > build/publish/images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: build/publish
          compression-level: 0
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: MinGW tools first on the PATH
        run: printf '%s\n' "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin" >> "$GITHUB_PATH"
      - name: Read the Emscripten version
        id: toolchain
        run: echo "emsdk=$(sed -n 's/^EMSDK_VERSION=//p' toolchain.env | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: ${{ steps.toolchain.outputs.emsdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: release-tree
          path: build/release/${{ inputs.version }}
      - name: Consumer test, staged, on Windows
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory "build/release/$VERSION" > server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          attempts=0
          until curl -fsS http://127.0.0.1:8766/ > /dev/null 2>&1; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 120 ]; then
              cat server.log
              echo "::error::the release server did not answer on port 8766"
              exit 1
            fi
            sleep 0.5
          done

          export OLY_RELEASE_URL=http://127.0.0.1:8766 OLY_ENGINE_SOURCE_DIR="$PWD"
          for environment in web native; do
            sh tools/release/staged_consumer_test.sh "$VERSION" "$environment" "$PWD/build/staged/$environment"
          done

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [engine, staged-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The saved images are loaded here, as big as the ones the staged-linux job built; not measured.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - uses: actions/download-artifact@v4
        with:
          name: release-tree
          path: build/release/${{ inputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: build/publish
      - name: Load the tested images and check they are the ones saved
        run: |
          gunzip -c build/publish/images.tar.gz | docker load
          while read -r name id; do
            loaded=$(docker image inspect --format '{{.Id}}' "$name")
            if [ "$loaded" != "$id" ]; then
              echo "::error::$name is $loaded after loading, tested as $id"
              exit 1
            fi
          done < build/publish/image-ids.txt
      - name: Push the images
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in dev wasm windows; do
            docker push "$REGISTRY/oly-$image:$VERSION"
          done
      - name: Tag the tested commit
        run: |
          # `check` already proved the tag was free in this run: one found here is the work of an earlier try of this job.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "tag v$VERSION exists already"
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi
      - name: Create the release
        run: |
          files=(build/release/"$VERSION"/download/v"$VERSION"/*)

          # A patch of an older line must not take the "latest" release away from a newer one: the launcher and the
          # pipe that creates a game read latest/download.
          latest=$(gh release view --json tagName --jq .tagName 2> /dev/null || true)
          flag=--latest
          if [ -n "$latest" ] && [ "$(printf '%s\nv%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "v$VERSION" ]; then
            flag=--latest=false
          fi

          # A re-run of a failed publish finds the release half made.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes "$flag" "${files[@]}"
          fi
